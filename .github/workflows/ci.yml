name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile, test, and package
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  compose-integration:
    name: Compose and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: mtcrm-ci-${{ github.run_id }}-${{ github.run_attempt }}
      JWT_SECRET: ci-ephemeral-signing-key-0123456789abcdef0123456789abcdef
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose models
        run: |
          docker compose config --quiet
          docker compose -f compose.dev.yml config --quiet
          # Compare default names without the CI-wide override, which otherwise
          # makes both Compose models report the same COMPOSE_PROJECT_NAME.
          full_name="$(env -u COMPOSE_PROJECT_NAME docker compose config --format json | jq -r '.name')"
          dev_name="$(env -u COMPOSE_PROJECT_NAME docker compose -f compose.dev.yml config --format json | jq -r '.name')"
          test "$dev_name" = "${full_name}-dev"

      - name: Build and start the complete stack
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Verify Nginx, API, OpenAPI, and Mailpit
        run: |
          docker compose exec -T frontend nginx -t
          curl --fail --silent --show-error http://localhost:3000/health
          curl --fail --silent --show-error http://localhost:3000/actuator/health | grep -q '"status":"UP"'
          curl --fail --silent --show-error http://localhost:3000/v3/api-docs | grep -q '"openapi"'
          curl --fail --silent --show-error http://localhost:3000/swagger-ui/index.html | grep -q 'Swagger UI'
          curl --fail --silent --show-error http://localhost:8025/api/v1/messages > mailpit-messages.json

      - name: Verify Flyway ran on PostgreSQL
        run: |
          migration_count="$(docker compose exec -T postgres psql -U mtcrm -d mtcrm -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM flyway_schema_history WHERE success")"
          test "$migration_count" -gt 0

      - name: Smoke onboarding, sessions, CRUD, files, and tenant isolation
        run: |
          set -euo pipefail
          api="http://localhost:3000/api/v1"
          mailpit="http://localhost:8025/api/v1"
          registration_email="ci+${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@vantora.local"
          status="$(curl --silent --show-error --dump-header registration.headers --output registration.json --write-out '%{http_code}' \
            --request POST "$api/auth/register" \
            --header 'Content-Type: application/json' \
            --data "{\"companyName\":\"CI Workspace\",\"firstName\":\"Build\",\"lastName\":\"Runner\",\"email\":\"${registration_email}\",\"password\":\"Vantora123!\"}")"
          test "$status" = "201"
          grep -q '"message"' registration.json
          ! grep -q '"accessToken"' registration.json
          ! grep -qi '^set-cookie:' registration.headers

          pending_state="$(docker compose exec -T postgres psql -U mtcrm -d mtcrm -Atc \
            "SELECT (SELECT count(*) FROM pending_registrations WHERE email='${registration_email}') || ':' || (SELECT count(*) FROM users WHERE email='${registration_email}');")"
          test "$pending_state" = "1:0"

          message_id=""
          for attempt in $(seq 1 30); do
            message_id="$(curl --fail --silent --show-error "$mailpit/messages" | jq -r --arg email "$registration_email" \
              '.messages[] | select(any(.To[]; .Address == $email)) | .ID' | head -n 1)"
            test -n "$message_id" && break
            sleep 1
          done
          test -n "$message_id"
          verification_token="$(curl --fail --silent --show-error "$mailpit/message/$message_id" | jq -r '.Text' \
            | sed -n 's/.*#token=\([^[:space:]]*\).*/\1/p' | head -n 1)"
          test -n "$verification_token"

          verify_status="$(jq -n --arg token "$verification_token" '{token:$token}' \
            | curl --silent --show-error --output verify.json --write-out '%{http_code}' \
                --request POST "$api/auth/verify-email" --header 'Content-Type: application/json' --data-binary @-)"
          test "$verify_status" = "200"

          jq -n --arg email "$registration_email" --arg password 'Vantora123!' \
            '{email:$email,password:$password}' \
            | curl --fail --silent --show-error --cookie-jar session.cookies --output login.json \
                --request POST "$api/auth/login" --header 'Content-Type: application/json' --data-binary @-
          access_token="$(jq -r '.accessToken' login.json)"
          user_id="$(jq -r '.user.id' login.json)"
          test -n "$access_token" && test "$access_token" != "null"
          before_refresh="$(awk '$6 == "mtcrm_refresh" {print $7}' session.cookies)"

          curl --fail --silent --show-error --cookie session.cookies --cookie-jar session.cookies \
            --request POST "$api/auth/refresh" --output refresh.json
          refreshed_access="$(jq -r '.accessToken' refresh.json)"
          after_refresh="$(awk '$6 == "mtcrm_refresh" {print $7}' session.cookies)"
          test -n "$refreshed_access" && test "$before_refresh" != "$after_refresh"

          curl --fail --silent --show-error --header "Authorization: Bearer $refreshed_access" \
            "$api/auth/me" --output me.json
          test "$(jq -r '.email' me.json)" = "$registration_email"
          test "$(jq 'has("accessToken")' me.json)" = "false"

          customer_payload="$(jq -n --arg owner "$user_id" \
            '{name:"CI Private Customer",email:"contact@ci.local",company:"CI",website:"https://example.test",status:"PROSPECT",ownerId:$owner}')"
          curl --fail --silent --show-error --header "Authorization: Bearer $refreshed_access" \
            --header 'Content-Type: application/json' --data "$customer_payload" \
            "$api/customers" --output customer.json
          customer_id="$(jq -r '.id' customer.json)"
          test -n "$customer_id" && test "$customer_id" != "null"

          curl --fail --silent --show-error --header "Authorization: Bearer $refreshed_access" \
            "$api/customers/export" --output customers.csv
          grep -q 'CI Private Customer' customers.csv

          python3 - <<'PY'
          from pathlib import Path
          data = bytearray(1_250_000)
          data[:8] = b'\x89PNG\r\n\x1a\n'
          Path('ci-image.png').write_bytes(data)
          PY
          curl --fail --silent --show-error --header "Authorization: Bearer $refreshed_access" \
            --form 'file=@ci-image.png;type=image/png' "$api/files" --output upload.json
          upload_key="$(jq -r '.key' upload.json)"
          upload_url="$(jq -r '.url' upload.json)"
          test "$(jq -r '.size' upload.json)" = "1250000"
          curl --fail --silent --show-error --header "Authorization: Bearer $refreshed_access" \
            "$upload_url" --output downloaded-image.png
          cmp ci-image.png downloaded-image.png
          curl --fail --silent --show-error --request DELETE --get \
            --header "Authorization: Bearer $refreshed_access" --data-urlencode "key=$upload_key" "$api/files" \
            | grep -q 'File deleted'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $refreshed_access" "$upload_url")" = "404"

          second_email="ci-isolation+${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@vantora.local"
          jq -n --arg email "$second_email" \
            '{companyName:"CI Isolated Workspace",firstName:"Second",lastName:"Admin",email:$email,password:"Vantora123!"}' \
            | curl --fail --silent --show-error --request POST "$api/auth/register" \
                --header 'Content-Type: application/json' --data-binary @- --output /dev/null
          second_message=""
          for attempt in $(seq 1 30); do
            second_message="$(curl --fail --silent --show-error "$mailpit/messages" | jq -r --arg email "$second_email" \
              '.messages[] | select(any(.To[]; .Address == $email)) | .ID' | head -n 1)"
            test -n "$second_message" && break
            sleep 1
          done
          test -n "$second_message"
          second_token="$(curl --fail --silent --show-error "$mailpit/message/$second_message" | jq -r '.Text' \
            | sed -n 's/.*#token=\([^[:space:]]*\).*/\1/p' | head -n 1)"
          jq -n --arg token "$second_token" '{token:$token}' \
            | curl --fail --silent --show-error --request POST "$api/auth/verify-email" \
                --header 'Content-Type: application/json' --data-binary @- --output /dev/null
          jq -n --arg email "$second_email" '{email:$email,password:"Vantora123!"}' \
            | curl --fail --silent --show-error --request POST "$api/auth/login" \
                --header 'Content-Type: application/json' --data-binary @- --output second-login.json
          second_access="$(jq -r '.accessToken' second-login.json)"
          isolation_status="$(curl --silent --show-error --output isolation.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $second_access" "$api/customers/$customer_id")"
          test "$isolation_status" = "404"

      - name: Verify edge request limiting
        run: |
          statuses="$(seq 1 100 | xargs -P 20 -I{} curl --silent --output /dev/null --write-out '%{http_code}\n' \
            'http://localhost:3000/api/v1/customers?q=expensive-search')"
          printf '%s\n' "$statuses" | grep -q '^429$'

      - name: Show service state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Remove temporary stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
